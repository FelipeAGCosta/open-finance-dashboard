[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "findash"
version = "1.0.0"
description = "Painel financeiro pessoal e local, alimentado pelo Open Finance via Pluggy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8"]

[project.scripts]
findash = "findash.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
findash = ["db/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "-q"
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textos em português usam ×, –, ç e afins de propósito
    "SIM108",  # if/else em bloco às vezes lê melhor que o ternário
]

[tool.ruff.lint.per-file-ignores]
"backend/findash/db/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["findash"]
