# Alembic: migrações do banco local (data/findash.db).
# O CLI aplica as migrações sozinho (python -m findash sync). Este arquivo serve para
# comandos manuais, por exemplo: .venv\Scripts\python.exe -m alembic revision --autogenerate -m "..."
[alembic]
script_location = backend/findash/db/migrations
prepend_sys_path = .
# Vazio: env.py usa data/findash.db do projeto.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
